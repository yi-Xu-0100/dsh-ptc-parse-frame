name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# tag 上的测试由 release.yml 负责，这里只管分支与 PR

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Show runtime
        run: |
          node --version
          npm --version

      # 仓库无运行时依赖、无 lockfile，所以直接 npm test，不做 npm ci
      - name: Run unit tests
        run: npm test
