name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要补发的 tag（需已推送，例如 v0.2.0）；从默认分支构建
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # tag 推送时默认 checkout 该 tag；workflow_dispatch 补发时 checkout 默认分支
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 生成 release note 要拿上一个 tag，浅克隆取不到
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check tag matches package.json version
        run: |
          set -euo pipefail
          tag_version="${TAG#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${TAG} 与 package.json 的 ${pkg_version} 不一致"
            exit 1
          fi

      - name: Run unit tests
        run: npm test

      - name: Pack bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination dist
          ls -l dist

      - name: Generate release notes
        run: |
          set -euo pipefail
          prev_tag="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          echo "上一个 tag：${prev_tag:-（无，本次按首次发布处理）}"
          node scripts/release-notes.mjs --from "$prev_tag" --to "$TAG" > "$RUNNER_TEMP/release-notes.md"
          echo '--- 自动生成的 release note ---'
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release 已存在，补传资产并刷新正文"
            gh release upload "$TAG" dist/*.tgz --clobber
            gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" dist/*.tgz \
              --title "$TAG" \
              --notes-file "$notes" \
              --verify-tag
          fi
